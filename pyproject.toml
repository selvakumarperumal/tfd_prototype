[project]
name = "tfd-prototype"
version = "0.1.0"
description = "A small prototype of a document mismatch detector: FastAPI + Pydantic + pydantic-graph + Socket.IO, with the model call stubbed out."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-socketio>=5.11",
    "pydantic>=2.8",
    "pydantic-graph>=2.44.0",
]

[project.scripts]
tfd = "app.main:main"

# The project is installed into the environment (editable), so `app` imports the same way
# however you start it: `uv run tfd`, `uv run app/main.py`, `uv run python -m app.main`,
# or `uv run uvicorn app.main:app`. Without this, only the last two would work.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
